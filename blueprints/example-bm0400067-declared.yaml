# Blueprint A — the allocation as declared in the syllabus and as computed in
# the institutional calculation workbook: two aggregate marks (coursework and
# final coursework assessment) split across six objectives by fixed shares.
#
# This blueprint is faithful to current practice. It is included so that the
# practice can be checked rather than assumed, and so that the official forms
# can be produced from it without hand transcription.

