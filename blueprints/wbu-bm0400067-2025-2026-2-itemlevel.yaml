# Blueprint B — the same course, same students, same 100-point scale, but with
# points attached to the assessment items that were actually recorded: nine
# classroom-participation sessions, five assignments, and the five rubric
# dimensions of the final report.
#
# The classroom sessions and the assignments follow the five laboratory units
# in the syllabus, so each is mapped to the objective that unit serves. The
# five rubric rows are declared as separate items even though only their sum
# was recorded: declaring them makes the tool say so (EV-AGG) instead of
# hiding it, and the day the instructor records the rows separately the
# blueprint already fits.
#
#   coursework  10 pts classroom + 40 pts assignments = 50
#   final       50 pts across the five rubric dimensions
#
# Compare against blueprint A with:
#   clover diagnose --cohort cohort.json --blueprint <this file>

