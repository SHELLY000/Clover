name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Regenerate reader fixtures
        run: python tests/make_fixtures.py
      - run: pytest -q
      - run: ruff check clover/ tests/
      - name: End-to-end on the shipped cohort
        run: clover run --config examples/run-example.yaml -o out/
      - name: The shipped record must verify
        run: clover verify --record out/BM0400067_2025-2026-2_record.json
      - name: No submission placeholder may be left unfilled at release
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/set_metadata.py --config submission.yaml --check
